[workspace]
# Every member ends up as bin/<package name> on the ramdisk.
members = ["init", "kbprobe", "logo", "pong", "shell", "shutdown", "vortex"]
resolver = "2"

[profile.dev]
# Debug info dwarfs the actual code: a program goes from ~2.8 MiB to ~100 KiB,
# which is the difference between fitting in the ramdisk and not. The loader
# only ever looks at PT_LOAD segments, so nothing is lost.
strip = true

# The fluid simulation is far too slow unoptimized. `strip` is repeated because
# cargo drops the profile-wide setting for packages with an override.
[profile.dev.package.vortex]
opt-level = 3
overflow-checks = false
strip = true
