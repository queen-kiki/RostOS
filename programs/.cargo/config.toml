[build]
target = "../x86_64-rost_os.json"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

# `-Z build-std` compiles core from source, which trips future-incompat lints
# that aren't ours to fix.
[future-incompat-report]
frequency = "never"
